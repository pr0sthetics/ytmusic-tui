[project]
name = "ytmusic-tui"
version = "0.4.0"
description = "Cliente TUI minimalista e rápido para YouTube Music"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Eeyore"}]
keywords = ["youtube-music", "tui", "music-player", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    # Pisos alinhados às versões realmente testadas (A12): o código usa
    # ``ScreenStackError``/``run_worker``/``Select`` do Textual 8.x,
    # ``requests_session`` do ytmusicapi 1.12 e a API do python-mpv 1.x.
    "textual>=8.2,<9",
    "ytmusicapi>=1.12,<2",
    # requests já vinha como transitiva do ytmusicapi; o T10-R2/R3 a importa
    # direto (sessão com timeouts + classificação) — declarada de verdade.
    "requests>=2.32.0",
    "python-mpv>=1.0,<2",
    "yt-dlp>=2026.8.19",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # A04: round-trip do config.toml preservando comentários/estrutura.
    "tomlkit>=0.13,<1",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "pip-audit>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/pr0sthetics/ytmusic-tui"
Repository = "https://github.com/pr0sthetics/ytmusic-tui"
Issues = "https://github.com/pr0sthetics/ytmusic-tui/issues"

[project.scripts]
ytmusic-tui = "ytmusic_tui.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "T201", "T203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["ytmusic_tui"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Bibliotecas de terceiros sem stubs/py.typed: o mypy não consegue analisar
# `mpv` (python-mpv) nem `yt_dlp`; o uso de ambas é encapsulado em
# `player/` e `download/`.
[[tool.mypy.overrides]]
module = ["mpv", "yt_dlp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: testes que tocam a rede de verdade (rode com YTMUSIC_INTEGRATION=1)",
]
# T14-R5 (incidente de 2026-10-17 no CI): um teste que passe de 10 min dumpa o
# stack de todas as threads e derruba o pytest na hora — falha rápida com
# diagnóstico em vez de horas silenciosas. Nenhum teste chega perto (folga
# >50× sobre o maior teste local, ~15× no runner mais lento); o contrato
# semanal (contract.yml) herda daqui por rodar o mesmo pytest.
faulthandler_timeout = "600"
faulthandler_exit_on_timeout = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Único arquivo não-`.py` de runtime do pacote (T06.1): sem ele, uma
# instalação limpa do wheel/sdist morre no startup da TUI com
# `StylesheetError` (o Textual resolve `CSS_PATH` relativo ao módulo).
# O job "pacote" do CI confere o conteúdo do artefato construído.
ytmusic_tui = ["**/*.tcss"]
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    # T14-R5: teto folgado para falhar rápido com diagnóstico (normal ~24 min).
    # Nasceu do incidente de 2026-10-17 (run 38998741203): um step travado
    # consumiu as 6 h de limite do GitHub em silêncio — sem stack, sem sinal.
    # O faulthandler do pyproject (10 min/teste) dumpa as threads e derruba o
    # pytest antes deste teto.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # T07: o ambiente de teste vem do uv.lock (resolve universal que cobre
      # 3.11–3.13), não de ranges flutuantes. O `--locked` falha se o lockfile
      # estiver ausente ou fora de sincronia com o pyproject.toml.
      # Sem tag móvel "v10" (só versões exatas): pin explícito; o Dependabot
      # (grupo actions) atualiza a versão.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # A libmpv é carregada no import de `mpv` (python-mpv), e o
      # ctypes.util.find_library procura tanto `libmpv.so.2` quanto o link
      # `libmpv.so`. No Ubuntu 24.04 o pacote `mpv` traz só o .so.2 e o
      # find_library falha; o `libmpv-dev` fornece o link não-versionado.
      - name: Dependências de sistema (mpv + libmpv + ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y mpv libmpv-dev ffmpeg

      # `uv sync` instala o projeto em modo editable e a CPython exata da
      # matriz; os passos seguintes usam caminhos explícitos no .venv (os
      # mesmos comandos canônicos do desenvolvimento local).
      - name: Instalar a partir do lockfile (uv sync --locked)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: .venv/bin/ruff check src/ tests/

      - name: Formatação (ruff format)
        run: .venv/bin/ruff format --check src/ tests/

      - name: Tipagem (mypy)
        run: .venv/bin/python -m mypy src/

      - name: Testes (offline, com mocks)
        run: .venv/bin/python -m pytest tests/ -q

      # T08 (reafirmada no T15-R7): cobertura de branches INFORMATIVA em
      # download/, library/ e player/ — sem threshold. Passo separado e não
      # bloqueante de propósito: o gate de testes é o passo acima e não pode
      # ser mascarado por este; o continue-on-error fica.
      # T14-R5: no incidente de 2026-10-17 este passo travou ~5h48m e o job só
      # morreu no limite de 6 h do GitHub, sem stack nem sinal. Este timeout de
      # step (normal ~12 min) corta mesmo sem dump; o faulthandler do pyproject
      # (10 min/teste) adiciona o dump das threads antes disso.
      - name: Cobertura de branches (informativa, sem threshold)
        if: matrix.python-version == '3.13'
        timeout-minutes: 20
        continue-on-error: true
        run: .venv/bin/python -m pytest tests/ -q --cov=ytmusic_tui.download --cov=ytmusic_tui.library --cov=ytmusic_tui.player --cov-branch --cov-report=term

  seguranca:
    runs-on: ubuntu-latest
    # T14-R5: mesmo motivo do job `testes` (normal ~19 s).
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Sem tag móvel "v10" (só versões exatas): pin explícito; o Dependabot
      # (grupo actions) atualiza a versão.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # T07: gate de sincronia — pyproject.toml e uv.lock não podem divergir.
      - name: Lockfile em sincronia (uv lock --check)
        run: uv lock --check

      # O alvo da auditoria é o conjunto TRAVADO (runtime + dev), não o
      # ambiente flutuante: exporta o resolve do lock para um requirements e
      # audita esse arquivo. `--no-emit-project` deixa o pacote local de fora
      # (não está no PyPI e não é auditável) — substitui o antigo
      # `--skip-editable`.
      - name: Exportar o conjunto travado (uv export)
        run: uv export --frozen --no-emit-project --extra dev --no-hashes -o /tmp/locked-requirements.txt

      # O pip-audit também vem do lock (extra dev, pinado) — nada flutuante.
      - name: Vulnerabilidades conhecidas (pip-audit no conjunto travado)
        run: uv run --locked --extra dev pip-audit -r /tmp/locked-requirements.txt

  # Verifica que o artefato publicável (sdist + wheel) instala e executa em
  # ambientes limpos — é o que o `pip install` do usuário final executa.
  # T14-R1: além do import/CSS/console script (T06.1), o `doctor` roda de
  # verdade (execução real headless; exit 0). A TUI completa não é
  # automatizável no runner e segue coberta pelo L4 local (tests/e2e).
  pacote:
    runs-on: ubuntu-latest
    # T14-R5: mesmo motivo do job `testes` (normal ~3 min).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # T14-R1: ffmpeg entra junto porque o smoke agora roda o `doctor`, que
      # confere os binários `mpv` e `ffmpeg` no PATH.
      - name: Dependências de sistema (mpv + libmpv + ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y mpv libmpv-dev ffmpeg

      - name: Build (sdist + wheel)
        run: |
          pip install build
          python -m build

      # T06.1: o `app.tcss` é runtime de verdade (sem ele o Textual morre no
      # startup com StylesheetError) e não era empacotado — o import sozinho
      # não pega isso, então o CONTEÚDO do artefato é conferido antes de
      # instalar. Este é o gate que faltava.
      - name: Conferir conteúdo do pacote (app.tcss no wheel e no sdist)
        run: |
          # Sem `| grep -q`: o grep sai no primeiro match e o produtor
          # (unzip/tar) toma SIGPIPE na escrita seguinte (o `pipefail` do
          # release.yml expôs isso em 2026-10-18; aqui ficava mascarado pela
          # ausência de pipefail — mesma correção). Lista → confere.
          LISTA_WHEEL="$(unzip -l dist/*.whl)"
          grep -q 'ytmusic_tui/tui/app.tcss' <<<"$LISTA_WHEEL"
          LISTA_SDIST="$(tar tzf dist/*.tar.gz)"
          grep -q 'ytmusic_tui/tui/app.tcss' <<<"$LISTA_SDIST"

      # T14-R1: o sdist também é instalado do zero (primeira cobertura
      # deste caminho) — até aqui só o wheel era exercitado.
      - name: Instalar wheel e sdist em ambientes limpos
        run: |
          python -m venv /tmp/venv-wheel
          /tmp/venv-wheel/bin/pip install dist/*.whl
          python -m venv /tmp/venv-sdist
          /tmp/venv-sdist/bin/pip install dist/*.tar.gz

      - name: Smoke test (import + CSS + console script) — wheel e sdist
        run: |
          for venv in /tmp/venv-wheel /tmp/venv-sdist; do
            "$venv/bin/python" -c "import ytmusic_tui, ytmusic_tui.main, ytmusic_tui.tui.app; print('import ok')"
            "$venv/bin/python" -c "import importlib.resources as res; assert res.files('ytmusic_tui.tui').joinpath('app.tcss').is_file(), 'app.tcss ausente na instalação'; print('css ok')"
            test -x "$venv/bin/ytmusic-tui"
          done

      # T14-R1 (Q4): os dois entry points suportados são exercitados — console
      # script e `python -m ytmusic_tui`. O exit 0 é o esperado contra o HOME
      # virgem do runner: diretórios e banco ausentes aparecem como "criado na
      # 1ª abertura", não como erro.
      - name: Doctor (execução real, exit 0) — wheel e sdist
        run: |
          for venv in /tmp/venv-wheel /tmp/venv-sdist; do
            echo "== $venv (console script)"
            "$venv/bin/ytmusic-tui" doctor
            echo "== $venv (python -m ytmusic_tui)"
            "$venv/bin/python" -m ytmusic_tui doctor
          done
